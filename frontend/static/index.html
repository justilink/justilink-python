<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustiLink – Connexion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">⚖️</div>
      <h1>JustiLink</h1>
      <p>Système d'aide juridictionnelle – District de Longueuil</p>
    </div>

    <div class="login-form">
      <h2>Connexion à votre espace</h2>

      <div id="alert-box" class="alert alert-error hidden">
        <span>⚠️</span>
        <span id="alert-msg">Identifiants incorrects.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Adresse courriel</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="email" id="email" placeholder="exemple@domaine.gouv.qc.ca" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span id="btn-text">Se connecter</span>
          <span id="btn-loader" class="loading-spinner hidden"></span>
        </button>
      </form>
    </div>

    <hr class="divider" />

    <div style="background:#f8fafc;border-radius:10px;padding:16px;margin-top:4px;">
      <p style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Comptes de démonstration</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        <button class="demo-btn" data-email="admin@justlink.gouv.qc.ca" data-pwd="Admin2026!" style="text-align:left;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-size:12px;cursor:pointer;transition:background 0.2s;">👑 Admin</button>
        <button class="demo-btn" data-email="greffier@justlink.gouv.qc.ca" data-pwd="Greffier2026!" style="text-align:left;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-size:12px;cursor:pointer;transition:background 0.2s;">⚖️ Greffier</button>
        <button class="demo-btn" data-email="avocat@justlink.gouv.qc.ca" data-pwd="Avocat2026!" style="text-align:left;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-size:12px;cursor:pointer;transition:background 0.2s;">👨‍⚖️ Avocat</button>
        <button class="demo-btn" data-email="citoyen@justlink.gouv.qc.ca" data-pwd="Citoyen2026!" style="text-align:left;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;font-size:12px;cursor:pointer;transition:background 0.2s;">👤 Citoyen</button>
      </div>
    </div>

    <div class="login-footer">
      <p>© 2026 Ministère de la Justice du Québec — <span>JustiLink v1.0</span></p>
      <p style="margin-top:4px;">🔒 Connexion sécurisée TLS 1.3</p>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLogged()) window.location.href = 'dashboard.html';

  const form    = document.getElementById('login-form');
  const alertBox = document.getElementById('alert-box');
  const alertMsg = document.getElementById('alert-msg');
  const btnText  = document.getElementById('btn-text');
  const btnLoader= document.getElementById('btn-loader');
  const submitBtn= document.getElementById('submit-btn');

  function showAlert(msg) {
    alertMsg.textContent = msg;
    alertBox.classList.remove('hidden');
  }

  function setLoading(on) {
    submitBtn.disabled = on;
    btnText.textContent = on ? 'Connexion…' : 'Se connecter';
    btnLoader.classList.toggle('hidden', !on);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');
    setLoading(true);

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const result = await AuthAPI.login(email, password);
      Auth.setToken(result.access_token);
      Auth.setUser(result.utilisateur);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showAlert(err.message || 'Identifiants incorrects. Veuillez réessayer.');
      setLoading(false);
    }
  });

  // Demo buttons
  document.querySelectorAll('.demo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('email').value = btn.dataset.email;
      document.getElementById('password').value = btn.dataset.pwd;
      btn.style.background = '#eff6ff';
    });
  });
</script>
</body>
</html>
